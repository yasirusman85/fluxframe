name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      # The site is served from https://yasirusman85.github.io/fluxframe/ — the router
      # reads this base from import.meta.env.BASE_URL.
      - run: npm run build
        env:
          VITE_BASE: /fluxframe/
      # SPA fallback: GitHub Pages serves 404.html for unknown paths, so deep links
      # (e.g. /fluxframe/create/cinema) load the app instead of a 404 page.
      - run: cp dist/index.html dist/404.html
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
